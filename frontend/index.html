<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="%APP_THEME%" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>%APP_NAME%</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Malayalam:wght@400;600&family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      #splash{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#E8431A;color:#fff;font-family:Inter,system-ui,sans-serif;transition:opacity .3s ease}
      #splash.hide{opacity:0;pointer-events:none}
      #splash .mark{animation:sp-drop .7s cubic-bezier(.3,1.5,.5,1) both}
      #splash .shadow{width:56px;height:8px;border-radius:50%;background:rgba(0,0,0,.22);margin-top:10px;animation:sp-shadow .7s ease-out both}
      #splash .name{margin-top:18px;font-size:30px;font-weight:700;letter-spacing:-.03em;animation:sp-fade .5s .45s both}
      #splash .tag{margin-top:6px;font-size:10px;font-weight:700;letter-spacing:.16em;opacity:.85;animation:sp-fade .5s .6s both}
      @keyframes sp-drop{0%{transform:translateY(-120px);opacity:0}60%{opacity:1}100%{transform:none;opacity:1}}
      @keyframes sp-shadow{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}
      @keyframes sp-fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
      @media (prefers-reduced-motion:reduce){#splash *{animation:none!important}}
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <svg class="mark" viewBox="0 0 64 64" width="96" height="96" fill="none">
        <rect width="64" height="64" rx="15" fill="#fff" />
        <path d="M32 26L46 34L32 42L18 34Z" fill="#FFC9B8" />
        <path d="M18 34L32 42V56L18 48Z" fill="#E8431A" />
        <path d="M32 42L46 34V48L32 56Z" fill="#F7896B" />
        <path d="M32 33.5C32 33.5 23.5 25.5 23.5 17.2a8.5 8.5 0 0 1 17 0C40.5 25.5 32 33.5 32 33.5Z" fill="#E8431A" stroke="#fff" stroke-width="1.6" stroke-linejoin="round" />
        <circle cx="32" cy="17.2" r="3.2" fill="#fff" />
      </svg>
      <div class="shadow"></div>
      <div class="name">%APP_NAME%</div>
      <div class="tag">%APP_TAGLINE%</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
