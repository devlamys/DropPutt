# Included in every location that sets its own headers (Nginx does not
# inherit add_header into a location that declares any).
# Web push (§62): gstatic serves the Firebase scripts the push service worker imports;
# the three googleapis hosts are the token / installation calls.
# img/media allow https: because uploads (bill photos, voice notes) are served
# from the R2 bucket's own domain.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(self), microphone=(self), camera=(self)" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' wss: https://fcmregistrations.googleapis.com https://firebaseinstallations.googleapis.com https://fcm.googleapis.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
